[project]
name = "voiceops-ai"
version = "0.1.0"
description = "Voice AI orchestration: STT, LLM tool calling, TTS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "voiceops-queue",
    "voiceops-telemetry",
]

[tool.uv.sources]
voiceops-queue = { path = "../../packages/queue-py", editable = true }
voiceops-telemetry = { path = "../../packages/telemetry-py", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `app` is a directory, not an installed package — the service runs from here.
pythonpath = ["."]
markers = [
    "integration: requires Postgres and the flight service",
    "model: requires a real LLM — never runs in CI",
]
addopts = "-q --strict-markers"
