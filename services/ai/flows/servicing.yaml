# Default flight servicing conversation.
#
# States narrow which tools the model can reach. The customer is never forced
# down a script — they can change topic, and the state follows what they
# actually did rather than what the flow expected.
#
# Validated on load: a transition to an undefined state, or on a tool the state
# does not offer, is a startup error rather than a dead-end mid-call.

id: servicing
description: Flight status, booking servicing, cancellation, rescheduling and refunds
initial: identify

states:

  identify:
    purpose: Find out what the customer needs and which booking or flight they mean.
    # Five tools, not nine. This is the state most calls start and end in, so it
    # is where selection accuracy matters most — the live weather and position
    # tools are here because "is my flight delayed by weather" and "has my plane
    # taken off" are opening questions, not follow-ups.
    tools:
      - check_flight_status
      - check_airport_weather
      - check_aircraft_position
      - get_booking
      - escalate_to_human
    transitions:
      # A successful lookup means we now know the booking, so servicing opens up.
      - tool: get_booking
        to: servicing
      - tool: escalate_to_human
        to: escalated
      # A failed lookup stays here: the customer needs to re-read the reference,
      # and the servicing tools must not become reachable for a booking we could
      # not find.
      - tool: get_booking
        on: failure
        to: identify

  servicing:
    # The live weather and position tools are deliberately NOT offered here,
    # although they are in `identify`. Measured: adding them took this state from
    # 6 tools to 8 and selection collapsed — "yes, cancel it" started resolving
    # to get_booking. The same two tools *improved* `identify`, where they are
    # semantically distinct from everything else on offer.
    #
    # So the cost is not tool count but how distinguishable the options are. This
    # state is already crowded with overlapping booking operations; two more
    # blurred it. They remain reachable — a customer asking about weather here
    # gets answered on the next turn from `identify`.
    purpose: The booking is known. Act on it, confirming before anything irreversible.
    tools:
      - get_booking
      - cancel_booking
      - get_reschedule_options
      - check_refund_status
      - check_flight_status
      - escalate_to_human
    transitions:
      - tool: get_reschedule_options
        to: choosing_flight
      - tool: cancel_booking
        to: resolved
      - tool: escalate_to_human
        to: escalated

  choosing_flight:
    purpose: Read the alternative flights back and let the customer pick one.
    tools:
      - get_reschedule_options
      - reschedule_booking
      - get_booking
      - escalate_to_human
    transitions:
      - tool: reschedule_booking
        to: resolved
      - tool: escalate_to_human
        to: escalated
      # A refused reschedule drops back to servicing, where cancelling or
      # escalating are still available.
      - tool: reschedule_booking
        on: failure
        to: servicing

  resolved:
    purpose: The change is done. Confirm it plainly and offer any further help.
    terminal: true
    tools:
      - get_booking
      - check_flight_status
      - check_refund_status
      - check_airport_weather
      - escalate_to_human
    transitions:
      - tool: escalate_to_human
        to: escalated

  escalated:
    purpose: A human is taking over. Reassure the customer and stop acting.
    terminal: true
    tools: []
