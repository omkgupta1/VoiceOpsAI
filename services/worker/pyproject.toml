[project]
name = "voiceops-worker"
version = "0.1.0"
description = "Queue worker, scheduler and retry engine"
requires-python = ">=3.12"
dependencies = [
    "voiceops-queue",
    "voiceops-telemetry",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
voiceops-queue = { path = "../../packages/queue-py", editable = true }
voiceops-telemetry = { path = "../../packages/telemetry-py", editable = true }

[tool.ruff]
line-length = 100
