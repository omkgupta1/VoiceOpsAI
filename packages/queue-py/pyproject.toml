[project]
name = "voiceops-queue"
version = "0.1.0"
description = "Redis-backed priority queue with scheduling, retries and crash recovery"
requires-python = ">=3.12"
dependencies = ["redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceops_queue"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# Async tests need no decorator: every `async def test_` just runs.
asyncio_mode = "auto"
testpaths = ["tests"]
# `integration` needs a live Redis; `-m "not integration"` is the CI unit pass.
markers = [
    "integration: requires a running Redis",
]
addopts = "-q --strict-markers"
