# VoiceOps AI — local development stack.
#
# Phase 0 brings up only the datastores and their admin UIs.
# Application services are added to this file as we build them.
#
# Note: Ollama and whisper.cpp deliberately run natively on the host,
# not here — Docker Desktop on macOS has no Metal/GPU passthrough, so
# containers reach them via host.docker.internal.

name: voiceops

services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voiceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceops}
      POSTGRES_DB: ${POSTGRES_DB:-voiceops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceops} -d ${POSTGRES_DB:-voiceops}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: voiceops-redis
    restart: unless-stopped
    # appendonly keeps queue state across restarts — we care, because
    # losing a job on `docker compose restart` would hide real bugs.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------- Application services ----------

  flight-mock:
    build: ./services/flight-mock
    container_name: voiceops-flight-mock
    restart: unless-stopped
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-voiceops}:${POSTGRES_PASSWORD:-voiceops}@postgres:5432/${POSTGRES_DB:-voiceops}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0.0}
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_ERROR_KIND: ${CHAOS_ERROR_KIND:-503}
      # Inside the compose network Jaeger is reachable by service name, not via
      # the host port mapping.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      ENV: local
    ports:
      - "${FLIGHT_MOCK_PORT:-8002}:8002"
    volumes:
      # Bind-mounted for hot reload: edit locally, uvicorn restarts itself.
      - ./services/flight-mock/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  # ---------- Observability ----------

  # Jaeger receives OTLP directly, so there is no collector in between. A
  # collector earns its place when you need sampling, redaction or fan-out to
  # several backends; here it would be one more process to run and explain.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: voiceops-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP — what the services export to
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: voiceops-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Most scrape targets run natively on the host, not in this network.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: voiceops-grafana
    restart: unless-stopped
    environment:
      # A login on a dashboard nobody else can reach is a speed bump, not
      # security. The port is bound to this machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3002:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------- Admin UIs (dev only) ----------

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: voiceops-pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-voiceops}:${POSTGRES_PASSWORD:-voiceops}@postgres:5432/${POSTGRES_DB:-voiceops}?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: voiceops-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:
  prometheus-data:
  grafana-data:
